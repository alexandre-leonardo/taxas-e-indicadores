name: Atualiza taxas de financiamento

on:
  schedule:
    - cron: "0 11 * * 1" # segunda 11h UTC = 08h BRT
  workflow_dispatch:

permissions:
  contents: write
  issues: write # vigia da cota SBPE abre/comenta issue

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - name: Testes (guarda — não publica com parser quebrado)
        run: npm test

      - name: Raspar fontes e atualizar JSON se mudou
        run: npm run scrape
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Atualizar painel de índices (BCB SGS)
        run: npm run indices
        continue-on-error: true # desacopla: falha aqui nunca derruba o commit das taxas

      - name: Commit + push + purge jsDelivr (se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/taxas-financiamento.json data/indices-historico.json
          if git diff --staged --quiet; then
            echo "Sem mudanças (taxas nem índices)."
          else
            PUB=$(jq -r '.meta.publishedAt' data/taxas-financiamento.json)
            RET=$(jq -r '.meta.retrievedAt' data/taxas-financiamento.json)
            git commit -m "chore(data): atualiza taxas/índices (publishedAt $PUB / retrievedAt $RET)"
            git push
            curl -sf "https://purge.jsdelivr.net/gh/alexandre-leonardo/taxas-e-indicadores@main/data/taxas-financiamento.json" || true
            curl -sf "https://purge.jsdelivr.net/gh/alexandre-leonardo/taxas-e-indicadores@main/data/indices-historico.json" || true
          fi

      # O vigia só AVISA (o corpo vem do LLM: vai por arquivo, nunca interpolado no shell).
      # Uma issue aberta por vez: achados seguintes viram comentário nela.
      - name: Vigia da cota SBPE — abrir/comentar issue
        if: hashFiles('alerta-cota.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create cota-sbpe --color D93F0B --description "Vigia da cota SBPE" 2>/dev/null || true
          ABERTA=$(gh issue list --label cota-sbpe --state open --json number --jq '.[0].number // empty')
          if [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --body-file alerta-cota.md
          else
            gh issue create --title "Vigia: possível mudança na cota SBPE — revisar" --label cota-sbpe --body-file alerta-cota.md
          fi

      # Depois do commit: o dado bom já foi publicado; aqui a run fica vermelha para a falha do BCB não passar em silêncio.
      - name: Falha visível se o BCB não respondeu
        if: env.BCB_FALHOU == '1'
        run: |
          echo "::error::BCB SGS falhou nesta rodada — TR/poupança/índices ficaram com o valor anterior. Ver anotações acima."
          exit 1
